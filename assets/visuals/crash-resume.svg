<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400">
<rect width="1000" height="400" fill="#FFFFFF"/>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#0B1F4A"/></marker></defs>
<text x="500" y="48" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#0B1F4A" text-anchor="middle" font-weight="bold">Crash and resume: the Lesson 16 drill</text>
<rect x="16" y="140" width="124" height="74" rx="10" fill="#E0F2FE" stroke="#0B1F4A" stroke-width="1.5"/>
<text x="78" y="170" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#0B1F4A" text-anchor="middle" font-weight="bold">run</text>
<text x="78" y="192" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#0B1F4A" text-anchor="middle" font-weight="normal">intake, score</text>
<line x1="142" y1="177" x2="150" y2="177" stroke="#0B1F4A" stroke-width="2" marker-end="url(#arr)"/>
<rect x="152" y="140" width="124" height="74" rx="10" fill="#E0F2FE" stroke="#0B1F4A" stroke-width="1.5"/>
<text x="214" y="170" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#0B1F4A" text-anchor="middle" font-weight="bold">approve</text>
<text x="214" y="192" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#0B1F4A" text-anchor="middle" font-weight="normal">human says yes</text>
<line x1="278" y1="177" x2="286" y2="177" stroke="#0B1F4A" stroke-width="2" marker-end="url(#arr)"/>
<rect x="288" y="140" width="124" height="74" rx="10" fill="#E0F2FE" stroke="#0B1F4A" stroke-width="1.5"/>
<text x="350" y="170" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#0B1F4A" text-anchor="middle" font-weight="bold">book</text>
<text x="350" y="192" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#0B1F4A" text-anchor="middle" font-weight="normal">writes the ledger</text>
<line x1="414" y1="177" x2="422" y2="177" stroke="#0B1F4A" stroke-width="2" marker-end="url(#arr)"/>
<rect x="424" y="140" width="124" height="74" rx="10" fill="#B91C1C" stroke="#0B1F4A" stroke-width="1.5"/>
<text x="486" y="170" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">CRASH</text>
<text x="486" y="192" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#FFFFFF" text-anchor="middle" font-weight="normal">mid-node, after write</text>
<line x1="550" y1="177" x2="558" y2="177" stroke="#0B1F4A" stroke-width="2" marker-end="url(#arr)"/>
<rect x="560" y="140" width="124" height="74" rx="10" fill="#E0F2FE" stroke="#0B1F4A" stroke-width="1.5"/>
<text x="622" y="170" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#0B1F4A" text-anchor="middle" font-weight="bold">resume</text>
<text x="622" y="192" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#0B1F4A" text-anchor="middle" font-weight="normal">new process, same dir</text>
<line x1="686" y1="177" x2="694" y2="177" stroke="#0B1F4A" stroke-width="2" marker-end="url(#arr)"/>
<rect x="696" y="140" width="124" height="74" rx="10" fill="#F59E0B" stroke="#0B1F4A" stroke-width="1.5"/>
<text x="758" y="170" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#0B1F4A" text-anchor="middle" font-weight="bold">book again</text>
<text x="758" y="192" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#0B1F4A" text-anchor="middle" font-weight="normal">ledger check: reuse</text>
<line x1="822" y1="177" x2="830" y2="177" stroke="#0B1F4A" stroke-width="2" marker-end="url(#arr)"/>
<rect x="832" y="140" width="124" height="74" rx="10" fill="#E0F2FE" stroke="#0B1F4A" stroke-width="1.5"/>
<text x="894" y="170" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#0B1F4A" text-anchor="middle" font-weight="bold">done</text>
<text x="894" y="192" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#0B1F4A" text-anchor="middle" font-weight="normal">exactly 1 booking</text>
<text x="500" y="280" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#475569" text-anchor="middle" font-weight="normal">The checkpoint rolls back nothing outside the graph; the node's own ledger check is what makes the redo safe.</text>
<text x="500" y="306" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#475569" text-anchor="middle" font-weight="normal">Unguarded, the same drill books twice (Lesson 28).</text>
</svg>
